name: Glyco-PAINT Release

on:
  push:
    tags:
      - "v*.*.*"  # Triggers only on version tags (e.g. v1.0.0)

jobs:
  build-macos:
    name: Build macOS Apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build macOS version
        run: ./shell-scripts/release-manager.sh --dry-run  # remove --dry-run for real build

  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build Windows .exe files
        run: mvn -B -Pwindows-exe -DskipTests clean package

      - name: Upload EXEs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            paint-generate-squares/target/*.exe
            paint-viewer/target/*.exe
            paint-get-omero/target/*.exe
            paint-create-experiment/target/*.exe

  release:
    name: Publish Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display collected artifacts
        run: ls -R dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}