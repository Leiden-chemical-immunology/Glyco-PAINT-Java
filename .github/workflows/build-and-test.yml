name: Build and Test

# Runs the full unit-test suite AND the end-to-end Generate Squares regression
# gate on every push and pull request, so a numeric regression cannot land
# unnoticed. The gate's reference data is committed, so it really runs here
# (it is not skipped).
#
# Scope is deliberately `mvn test`, not `verify`/`install`: the packaging phases
# build macOS .app bundles, Windows .exe wrappers and installer fat JARs, and
# deploy the Fiji plugin to /Applications — none of which is meaningful on a CI
# runner, and none of which affects whether the code is correct.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests + regression gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # The parent POM enforces requireJavaVersion [1.8,1.9), and the whole
      # project is a Java 8 baseline (Fiji), so build on 8 — same as the
      # existing site workflow.
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 8
          cache: maven

      - name: Run tests
        # Headless is explicit, and it is load-bearing. The first CI run caught a real bug
        # this way: PaintLogger unconditionally opened a Swing console window, so any
        # headless run threw HeadlessException on its first log line - and lost the log file
        # with it. paint-shared-utils is now UI-free (A1), and the logger only writes to a UI
        # sink if a GUI app has registered one. Keeping this flag means any regression of
        # that kind fails here, loudly, instead of on a user's server.
        run: mvn -B -U -Djava.awt.headless=true test

      # Surefire reports make a red build diagnosable without re-running locally.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14
