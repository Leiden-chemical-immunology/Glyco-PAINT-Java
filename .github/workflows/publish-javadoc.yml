name: Publish JavaDoc

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      # ✅ Build all modules and install them locally
      - name: Build full project
        run: mvn -B -U -DskipTests install

      # ✅ Now JavaDoc can be resolved correctly
      - name: Build JavaDoc for all modules
        run: mvn -B javadoc:javadoc javadoc:aggregate

      - name: Deploy JavaDoc to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/apidocs
          keep_files: false
          force_orphan: true