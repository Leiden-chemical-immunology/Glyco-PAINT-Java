name: Glyco-PAINT Release

permissions:
  contents: write

on:
  workflow_dispatch:

#on:
#  push:
#    tags:
#      - "v*.*.*"

jobs:
  build-macos:
    name: Build macOS Apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install Homebrew Bash
        run: |
          brew install bash
          echo "Installed Bash at $(brew --prefix)/bin/bash"
          $(brew --prefix)/bin/bash --version

      - name: Build macOS version
        run: |
          BASH_BIN="$(brew --prefix)/bin/bash"
          echo "Using Bash at: $BASH_BIN"
          "$BASH_BIN" ./shell-scripts/release-manager.sh
        env:
          GITHUB_ACTIONS: true

      - name: Collect macOS artifacts
        run: |
          mkdir -p dist/macos
          if [ -d Glyco-PAINT-builds/dist/macOS ]; then
            cp -r Glyco-PAINT-builds/dist/macOS/* dist/macos/
          elif [ -d ../Glyco-PAINT-builds/dist/macOS ]; then
            cp -r ../Glyco-PAINT-builds/dist/macOS/* dist/macos/
          else
            echo "⚠️ No dist directory found — searching for .app/.sh files"
            find . -type f \( -name "*.app" -o -name "*.app.zip" -o -name "*.sh" \) -exec cp -r {} dist/macos/ \;
          fi
          ls -R dist/macos || true
        shell: bash

      - name: Zip macOS build for distribution
        run: |
          echo "Detecting latest Glyco-PAINT build in ../Glyco-PAINT-Builds/build/macOS..."
          BASE_DIR="${GITHUB_WORKSPACE}/../Glyco-PAINT-Builds"
          LATEST_BUILD=$(ls -td "${BASE_DIR}/build/macOS/Glyco-PAINT-"* | head -n 1)

          if [ -z "$LATEST_BUILD" ]; then
            echo "❌ ERROR: No build directories found!"
            exit 1
          fi

          VERSION=$(basename "$LATEST_BUILD" | sed 's/Glyco-PAINT-//')
          DIST_DIR="${BASE_DIR}/dist/macOS"
          DIST_ZIP="${DIST_DIR}/Glyco-PAINT-macOS-${VERSION}.zip"

          echo "📦 Found latest build: $LATEST_BUILD"
          echo "Zipping to: $DIST_ZIP"
          mkdir -p "$DIST_DIR"

          cd "${BASE_DIR}/build/macOS" || exit 1
          zip -qry "$DIST_ZIP" "Glyco-PAINT-${VERSION}"

          echo "✅ Created $DIST_ZIP"
          ls -lh "$DIST_DIR"
        shell: bash

      - name: Upload macOS build artifacts
        run: |
          mkdir -p dist-upload/macos
          cp -R ../Glyco-PAINT-Builds/dist/macOS/* dist-upload/macos/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist-upload/macos/**
          if-no-files-found: warn

  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Build Windows .exe files
        run: |
          echo "Starting Windows build..."
          mvn -B -Pwindows-exe -DskipTests clean package
        shell: cmd

      - name: Collect executables
        run: |
          set BASE=%GITHUB_WORKSPACE%
          set BUILD_DIR=%BASE%\Glyco-PAINT-Builds\build\Windows
          echo "📦 Collecting executables into %BUILD_DIR%..."
          if not exist "%BUILD_DIR%" mkdir "%BUILD_DIR%"

          for %%M in (paint-generate-squares paint-viewer paint-get-omero paint-create-experiment) do (
            if exist "%%M\target\*.exe" (
              copy "%%M\target\*.exe" "%BUILD_DIR%\" >nul
            )
          )

          echo "✅ Files now in:"
          dir "%BUILD_DIR%"
        shell: cmd

      - name: Zip Windows build
        run: |
          set BASE=%GITHUB_WORKSPACE%
          set BUILD_DIR=%BASE%\Glyco-PAINT-Builds\build\Windows
          set DIST_DIR=%BASE%\Glyco-PAINT-Builds\dist\Windows
          for /f %%v in ('powershell -Command "$env:GITHUB_REF_NAME -replace \"^v\", \"\""') do set VERSION=%%v
          if not exist "%DIST_DIR%" mkdir "%DIST_DIR%"
          echo "📦 Creating %DIST_DIR%\Glyco-PAINT-Windows-%VERSION%.zip"
          powershell Compress-Archive -Path "%BUILD_DIR%\*.exe" -DestinationPath "%DIST_DIR%\Glyco-PAINT-Windows-%VERSION%.zip" -Force
          echo "✅ Done:"
          dir "%DIST_DIR%"
        shell: cmd

      - name: Upload Windows artifacts
        run: |
          set BASE=%GITHUB_WORKSPACE%
          if not exist dist-upload mkdir dist-upload
          if not exist dist-upload\windows mkdir dist-upload\windows
          copy "%BASE%\Glyco-PAINT-Builds\dist\Windows\*.zip" dist-upload\windows\ >nul
          dir dist-upload\windows
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-upload/windows/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Display collected artifacts
        run: ls -R release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/macos/**/*
            release/windows/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}