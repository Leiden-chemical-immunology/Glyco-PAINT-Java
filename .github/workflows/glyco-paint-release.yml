name: Glyco-PAINT Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"   # Trigger only when a version tag is pushed (e.g. v0.0.15)

jobs:
  build-macos:
    name: Build macOS Apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Build macOS version
        run: ./shell-scripts/release-manager.sh
        env:
          GITHUB_ACTIONS: true    # ensures artifacts copied into dist/macos

      - name: Collect macOS artifacts
        run: |
          mkdir -p dist/macos

          # ✅ First try release-manager output
          if [ -d Glyco-PAINT-builds/dist ]; then
            echo "📦 Found Glyco-PAINT-builds/dist — copying..."
            cp -r Glyco-PAINT-builds/dist/* dist/macos/
          elif [ -d ../Glyco-PAINT-builds/dist ]; then
            echo "📦 Found ../Glyco-PAINT-builds/dist — copying..."
            cp -r ../Glyco-PAINT-builds/dist/* dist/macos/
          elif [ -d dist/macos ] && [ "$(ls -A dist/macos)" ]; then
            echo "✅ Artifacts already present in dist/macos (from release-manager)"
          else
            echo "⚠️ No dist directory found — searching module targets..."
            find . -type f \( -name "*.app" -o -name "*.app.zip" -o -name "*.sh" \) -exec cp -r {} dist/macos/ \;
          fi

          echo "✅ macOS artifacts collected:"
          ls -R dist/macos || true

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/macos/**
          if-no-files-found: warn

  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      # 🧱 Verify icons
      - name: Verify icons
        run: |
          echo "Checking for .ico icons..."
          dir /s /b *.ico || echo "⚠️ No .ico files found!"
          echo "✅ Icon verification step complete."
        shell: cmd

      # 🏗️ Build Windows executables (Launch4j or similar)
      - name: Build Windows .exe files
        run: |
          echo "Starting Windows build..."
          mvn -B -Pwindows-exe -DskipTests clean package
        shell: cmd

      # 📦 Collect all built .exe artifacts
      - name: Collect Windows executables
        run: |
          mkdir dist
          if exist paint-generate-squares\target\*.exe copy paint-generate-squares\target\*.exe dist\
          if exist paint-viewer\target\*.exe copy paint-viewer\target\*.exe dist\
          if exist paint-get-omero\target\*.exe copy paint-get-omero\target\*.exe dist\
          if exist paint-create-experiment\target\*.exe copy paint-create-experiment\target\*.exe dist\
          echo "✅ Windows executables collected:"
          dir dist
        shell: cmd

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/**
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display collected artifacts
        run: ls -R dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}