name: Glyco-PAINT Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"   # Trigger only when a version tag is pushed (e.g. v0.0.25)

jobs:
  build-macos:
    name: Build macOS Apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      # 🧱 Install modern Bash (v5) and run release-manager under it
      - name: Install Homebrew Bash
        run: |
          brew install bash
          echo "Installed Bash at $(brew --prefix)/bin/bash"
          $(brew --prefix)/bin/bash --version

      - name: Build macOS version
        run: |
          BASH_BIN="$(brew --prefix)/bin/bash"
          echo "Using Bash at: $BASH_BIN"
          "$BASH_BIN" ./shell-scripts/release-manager.sh
        env:
          GITHUB_ACTIONS: true

      # 📦 Collect and copy artifacts into Glyco-PAINT-Builds/dist/macOS
      - name: Collect macOS artifacts
        run: |
          mkdir -p dist/macos

          # ✅ First try release-manager output
          if [ -d Glyco-PAINT-builds/dist/macOS ]; then
            echo "📦 Found Glyco-PAINT-builds/dist/macOS — copying..."
            cp -r Glyco-PAINT-builds/dist/macOS/* dist/macos/
          elif [ -d ../Glyco-PAINT-builds/dist/macOS ]; then
            echo "📦 Found ../Glyco-PAINT-builds/dist/macOS — copying..."
            cp -r ../Glyco-PAINT-builds/dist/macOS/* dist/macos/
          elif [ -d dist/macos ] && [ "$(ls -A dist/macos)" ]; then
            echo "✅ Artifacts already present in dist/macos (from release-manager)"
          else
            echo "⚠️ No dist directory found — searching module targets..."
            find . -type f \( -name "*.app" -o -name "*.app.zip" -o -name "*.sh" \) -exec cp -r {} dist/macos/ \;
          fi

          echo "✅ macOS artifacts collected:"
          ls -R dist/macos || true

          mkdir -p ../Glyco-PAINT-Builds/dist/macOS
          cp -R dist/macos/* ../Glyco-PAINT-Builds/dist/macOS/ || true
          echo "✅ macOS artifacts copied to ../Glyco-PAINT-Builds/dist/macOS"
          ls -R ../Glyco-PAINT-Builds/dist/macOS || true

      # 🗜️ Zip versioned macOS build
      - name: Zip macOS build for distribution
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Preparing macOS folder structure..."
          mkdir -p ../Glyco-PAINT-Builds/build/macOS
          mkdir -p ../Glyco-PAINT-Builds/dist/macOS

          BUILD_DIR="../Glyco-PAINT-Builds/build/macOS/Glyco-PAINT-${VERSION}"
          DIST_ZIP="../Glyco-PAINT-Builds/dist/macOS/Glyco-PAINT-macOS-${VERSION}.zip"

          if [ -d "$BUILD_DIR" ]; then
            echo "Zipping macOS build from $BUILD_DIR → $DIST_ZIP"
            cd ../Glyco-PAINT-Builds/build/macOS || exit 1
            zip -qry "$DIST_ZIP" "Glyco-PAINT-${VERSION}"
            echo "✅ Created $DIST_ZIP"
          else
            echo "❌ ERROR: Expected build folder $BUILD_DIR not found!"
            echo "Available structure:"
            ls -R ../Glyco-PAINT-Builds/build || true
            exit 1
          fi

          echo "✅ macOS zip completed."
          ls -lh ../Glyco-PAINT-Builds/dist/macOS/
        shell: bash

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: ../Glyco-PAINT-Builds/dist/macOS/**
          if-no-files-found: warn

  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Verify icons
        run: |
          echo "Checking for .ico icons..."
          dir /s /b *.ico || echo "⚠️ No .ico files found!"
          echo "✅ Icon verification step complete."
        shell: cmd

      - name: Build Windows .exe files
        run: |
          echo "Starting Windows build..."
          mvn -B -Pwindows-exe -DskipTests clean package
        shell: cmd

      - name: Collect Windows executables
        run: |
          mkdir dist
          if exist paint-generate-squares\target\*.exe copy paint-generate-squares\target\*.exe dist\
          if exist paint-viewer\target\*.exe copy paint-viewer\target\*.exe dist\
          if exist paint-get-omero\target\*.exe copy paint-get-omero\target\*.exe dist\
          if exist paint-create-experiment\target\*.exe copy paint-create-experiment\target\*.exe dist\
          echo "✅ Windows executables collected:"
          dir dist
        shell: cmd

      # ✅ Copy .exe files to Glyco-PAINT-Builds/build/Windows
      - name: Copy executables to Glyco-PAINT-Builds/build/Windows
        run: |
          echo "Copying Windows executables to ../Glyco-PAINT-Builds/build/Windows..."
          mkdir "..\Glyco-PAINT-Builds" 2>nul
          mkdir "..\Glyco-PAINT-Builds\build" 2>nul
          mkdir "..\Glyco-PAINT-Builds\build\Windows" 2>nul
          copy dist\*.exe "..\Glyco-PAINT-Builds\build\Windows\" >nul
          echo "✅ Windows executables copied successfully:"
          dir "..\Glyco-PAINT-Builds\build\Windows"
        shell: cmd

      # 🗜️ Zip Windows executables
      - name: Zip Windows executables
        run: |
          for /f "delims=v" %%v in ("%GITHUB_REF_NAME%") do set VERSION=%%v
          echo "Zipping Windows executables into ../Glyco-PAINT-Builds/dist/Windows..."
          mkdir "..\Glyco-PAINT-Builds\dist" 2>nul
          mkdir "..\Glyco-PAINT-Builds\dist\Windows" 2>nul
          powershell Compress-Archive -Path "..\Glyco-PAINT-Builds\build\Windows\*.exe" -DestinationPath "..\Glyco-PAINT-Builds\dist\Windows\Glyco-PAINT-Windows-%VERSION%.zip" -Force
          echo "✅ Created Glyco-PAINT-Windows-%VERSION%.zip"
          dir "..\Glyco-PAINT-Builds\dist\Windows"
        shell: cmd

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: ../Glyco-PAINT-Builds/dist/Windows/**
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Display collected artifacts
        run: ls -R release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/macos/**/*
            release/windows/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}