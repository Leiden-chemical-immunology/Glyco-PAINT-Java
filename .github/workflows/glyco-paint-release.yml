name: Glyco-PAINT Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-macos:
    name: Build macOS Apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install Homebrew Bash
        run: |
          brew install bash
          echo "Installed Bash at $(brew --prefix)/bin/bash"
          $(brew --prefix)/bin/bash --version

      - name: Build macOS version
        run: |
          BASH_BIN="$(brew --prefix)/bin/bash"
          echo "Using Bash at: $BASH_BIN"
          "$BASH_BIN" ./shell-scripts/release-manager.sh
        env:
          GITHUB_ACTIONS: true

      - name: Collect macOS artifacts
        run: |
          mkdir -p dist/macos
          if [ -d Glyco-PAINT-builds/dist/macOS ]; then
            cp -r Glyco-PAINT-builds/dist/macOS/* dist/macos/
          elif [ -d ../Glyco-PAINT-builds/dist/macOS ]; then
            cp -r ../Glyco-PAINT-builds/dist/macOS/* dist/macos/
          else
            echo "⚠️ No dist directory found — searching for .app/.sh files"
            find . -type f \( -name "*.app" -o -name "*.app.zip" -o -name "*.sh" \) -exec cp -r {} dist/macos/ \;
          fi
          ls -R dist/macos || true
        shell: bash

      - name: Zip macOS build for distribution
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout | sed 's/-SNAPSHOT//')
          echo "📦 Detected Maven build version: $VERSION"
          mkdir -p ../Glyco-PAINT-Builds/build/macOS ../Glyco-PAINT-Builds/dist/macOS
          BUILD_DIR="../Glyco-PAINT-Builds/build/macOS/Glyco-PAINT-${VERSION}"
          DIST_ZIP="../Glyco-PAINT-Builds/dist/macOS/Glyco-PAINT-macOS-${VERSION}.zip"
          if [ -d "$BUILD_DIR" ]; then
            cd ../Glyco-PAINT-Builds/build/macOS || exit 1
            zip -qry "$DIST_ZIP" "Glyco-PAINT-${VERSION}"
            echo "✅ Created $DIST_ZIP"
          else
            echo "❌ ERROR: Expected build folder $BUILD_DIR not found!"
            ls -R ../Glyco-PAINT-Builds/build || true
            exit 1
          fi
          ls -lh ../Glyco-PAINT-Builds/dist/macOS/
        shell: bash

      - name: Upload macOS build artifacts
        run: |
          mkdir -p dist-upload/macos
          cp -R ../Glyco-PAINT-Builds/dist/macOS/* dist-upload/macos/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist-upload/macos/**
          if-no-files-found: warn

  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Verify icons
        run: |
          echo "Checking for .ico icons..."
          dir /s /b *.ico || echo "⚠️ No .ico files found!"
        shell: cmd

      - name: Build Windows .exe files
        run: |
          echo "Starting Windows build..."
          mvn -B -Pwindows-exe -DskipTests clean package
        shell: cmd

      - name: Collect Windows executables
        run: |
          echo "Collecting Windows executables..."
          mkdir dist 2>nul
          for %%M in (paint-generate-squares paint-viewer paint-get-omero paint-create-experiment) do (
            if exist "%%M\target\*.exe" (
              echo "📦 Found executables in %%M\target — copying..."
              copy "%%M\target\*.exe" dist\ >nul
            ) else (
              echo "⚠️ No executables found in %%M\target"
            )
          )
          dir dist
        shell: cmd

      - name: Copy executables to build directory
        run: |
          set BASE=%GITHUB_WORKSPACE%
          echo "Copying executables to %BASE%\Glyco-PAINT-Builds\build\Windows..."
          mkdir "%BASE%\Glyco-PAINT-Builds" 2>nul
          mkdir "%BASE%\Glyco-PAINT-Builds\build" 2>nul
          mkdir "%BASE%\Glyco-PAINT-Builds\build\Windows" 2>nul
          copy dist\*.exe "%BASE%\Glyco-PAINT-Builds\build\Windows\" >nul
          dir "%BASE%\Glyco-PAINT-Builds\build\Windows"
        shell: cmd

      - name: Zip Windows executables
        run: |
          set BASE=%GITHUB_WORKSPACE%
          for /f %%v in ('powershell -Command "$env:GITHUB_REF_NAME -replace \"^v\", \"\""') do set VERSION=%%v
          echo "Zipping into %BASE%\Glyco-PAINT-Builds\dist\Windows..."
          mkdir "%BASE%\Glyco-PAINT-Builds\dist" 2>nul
          mkdir "%BASE%\Glyco-PAINT-Builds\dist\Windows" 2>nul
          powershell Compress-Archive -Path "%BASE%\Glyco-PAINT-Builds\build\Windows\*.exe" -DestinationPath "%BASE%\Glyco-PAINT-Builds\dist\Windows\Glyco-PAINT-Windows-%VERSION%.zip" -Force
          dir "%BASE%\Glyco-PAINT-Builds\dist\Windows"
        shell: cmd

      - name: Prepare and upload Windows artifacts
        run: |
          set BASE=%GITHUB_WORKSPACE%
          if not exist dist-upload mkdir dist-upload
          if not exist dist-upload\windows mkdir dist-upload\windows
          copy "%BASE%\Glyco-PAINT-Builds\dist\Windows\*.zip" dist-upload\windows\ >nul
          echo "✅ Prepared for upload:"
          dir dist-upload\windows
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-upload/windows/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Display collected artifacts
        run: ls -R release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/macos/**/*
            release/windows/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}