name: Glyco-PAINT Release

on:
  push:
    tags:
      - "v*.*.*"   # Trigger only when a version tag is pushed (e.g. v0.0.15)

jobs:
  build-macos:
    name: Build macOS Apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Build macOS version
        run: ./shell-scripts/release-manager.sh

      - name: Collect macOS artifacts
        run: |
          mkdir -p dist/macos
          cp -r ../Glyco-PAINT-builds/dist/* dist/macos/ || true

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/macos/**

  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Build Windows .exe files
        run: mvn -B -Pwindows-exe -DskipTests clean package

      - name: Collect Windows executables
        run: |
          mkdir dist
          copy paint-generate-squares\target\*.exe dist\
          copy paint-viewer\target\*.exe dist\
          copy paint-get-omero\target\*.exe dist\
          copy paint-create-experiment\target\*.exe dist\
        shell: cmd

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/**

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display collected artifacts
        run: ls -R dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}